[global]
AuthservID      = mail.bambania.com
WorkerThreads   = 1
Foreground      = yes
DnsNameserver   = 127.0.0.1
DnsTimeout      = 5
SealDomain      = bambania.com
SealSelector    = arc2026
SealKeyFile     = test/keys/arc.key
SignedHeaders    = from:to:subject:date:message-id

[listener:both]
Socket          = inet:8895@0.0.0.0
Mode            = both
